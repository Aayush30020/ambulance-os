name: Keep AmbulanceOS Backend Alive

on:
  schedule:
    # Run every 10 minutes, offset from common :00/:10/:20 schedule times.
    - cron: "7,17,27,37,47,57 * * * *"

  # Allows manual execution from GitHub Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            https://ambulance-os-backend.onrender.com/
