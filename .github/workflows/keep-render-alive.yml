name: Keep AmbulanceOS Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            https://ambulance-os-backend.onrender.com/
